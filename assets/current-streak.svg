<svg xmlns="http://www.w3.org/2000/svg" width="340" height="110" viewBox="0 0 340 110" role="img" aria-label="CURRENT STREAK: 15 days">
  <style>
    .label {
      fill: #57606a;
      font: 700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      letter-spacing: 0.14em;
    }
    .value {
      fill: #24292f;
      font: 700 40px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    .sub {
      fill: #57606a;
      font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    .accent {
      fill: #94e2d5;
      opacity: 0.95;
    }
    @media (prefers-color-scheme: dark) {
      .label, .sub {
        fill: #8b949e;
      }
      .value {
        fill: #c9d1d9;
      }
      .accent {
        fill: #94e2d5;
      }
    }
  </style>

  <rect class="accent" x="0" y="18" width="4" height="74" rx="2" />
  <text class="label" x="18" y="28">CURRENT STREAK</text>
  <text class="value" x="18" y="70">15</text>
  <text class="sub" x="18" y="92">days</text>
</svg>